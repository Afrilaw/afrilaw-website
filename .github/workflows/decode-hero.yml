name: Decode hero image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    if: github.repository == 'Afrilaw/afrilaw-website'
    steps:
      - uses: actions/checkout@v4
      - name: Decode hero.jpg and remove helper files
        run: |
          set -euo pipefail
          if [ ! -f hero.jpg.b64 ]; then
            echo "No hero.jpg.b64; nothing to do"
            exit 0
          fi
          base64 -d hero.jpg.b64 > hero.jpg
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('hero.jpg')
          print('decoded', p.stat().st_size, 'bytes; header', p.read_bytes()[:3])
          assert p.read_bytes()[:3] == b'\xff\xd8\xff', 'not a JPEG'
          PY
          rm -f hero.jpg.b64
          rm -f .github/workflows/decode-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add decoded hero.jpg and remove encode helpers"
          git push
